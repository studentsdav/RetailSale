version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: retail_postgres
    restart: always
    environment:
      POSTGRES_DB: retailsale_db
      POSTGRES_USER: retailsale_user
      POSTGRES_PASSWORD: retailsale_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://retailsale_user:retailsale_password@postgres:5432/retailsale_db
      - DB_SSL=false
    depends_on:
      - postgres

volumes:
  pgdata:
