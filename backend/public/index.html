<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FAMALTH LYNX - Retailpos, billing, accounting, and reporting in one secure flow.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FAMALTH LYNX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FAMALTH LYNX</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #loading-splash {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
    }
    .logo-badge {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 12px 35px -5px rgba(13, 148, 136, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      animation: logoPulseGlow 1.8s infinite ease-in-out;
    }
    .logo-badge img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    @keyframes logoPulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 30px -5px rgba(13, 148, 136, 0.3);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 16px 45px 0px rgba(13, 148, 136, 0.5);
      }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="logo-badge">
      <img src="favicon.png" alt="FAMALTH LYNX">
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
